[project]
name = "lidl"
version = "0.1.0"
description = "LIDL localization, evaluation, ablation and downstream repair reproduction"
requires-python = ">=3.11,<3.12"
dependencies = [
    "matplotlib==3.10.6", "numpy==2.2.6", "pandas==2.2.3", "loguru==0.7.3",
    "networkx>=3.4,<4", "scipy>=1.14,<2", "scikit-learn==1.7.2",
    "litellm==1.76.3", "pydantic==2.13.4", "python-dotenv==1.2.3",
    "rank-bm25==0.2.2", "tree-sitter==0.23.2", "tree-sitter-language-pack==1.14.3",
    "pyyaml==6.0.3", "gitpython==3.1.45", "tqdm==4.67.1",
    "openai-codex>=0.147.0", "pytest>=8,<9",
]
